[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xrpl-explain"
version = "0.0.1"
description = "Explain an XRP Ledger transaction result: a typed before/after state diff (MPT/Vault/Loan-aware) and a plain-language result-code explanation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Harry Malinski" }]
keywords = ["xrpl", "rippled", "xrp-ledger", "metadata", "debugging"]
dependencies = []

[project.scripts]
xrpl-explain = "xrpl_explain.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["xrpl_explain*"]
